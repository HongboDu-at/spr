name: Release

on:
  push:
    tags:
      # Fork releases only. Upstream tags look like `v1.3.7`, and this fork has
      # all of them from spacedentist/spr. The `-enhanced.` part of the version
      # keeps this pattern from matching any of them.
      - "v*-enhanced.*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  # `gh` finds the repository from a checkout or from GH_REPO. The publish job
  # has no checkout, so it needs this.
  GH_REPO: ${{ github.repository }}

jobs:
  create_release:
    name: Create the draft release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Check the tag against Cargo.toml
        run: |
          version="$(grep -m1 '^version = ' spr/Cargo.toml | cut -d'"' -f2)"
          if [ "${GITHUB_REF_NAME#v}" != "$version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match version $version in spr/Cargo.toml"
            exit 1
          fi

      - name: Create the release
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            --draft \
            --prerelease="${{ contains(github.ref_name, '-rc') }}"

  build:
    name: Build ${{ matrix.name }}
    needs: create_release
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Build on the oldest Ubuntu that GitHub still offers. A binary that
          # links glibc runs on that version and newer, never on older, so the
          # build machine sets the floor for everyone. 22.04 carries glibc
          # 2.35; 24.04 carries 2.39 and locks out every older system.
          - os: ubuntu-22.04
            name: linux-x86_64
          # ARM Linux is free on a public repository only.
          - os: ubuntu-22.04-arm
            name: linux-arm64
          - os: macos-latest
            name: macos-arm64

    steps:
      - uses: actions/checkout@v5

      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --no-self-update

      # Test in the release profile, so that the build below reuses everything
      # instead of compiling all the dependencies a second time.
      - name: Run tests
        run: cargo test --release --locked

      - name: Build
        run: |
          cargo build --release --locked
          strip target/release/spr

      # The name holds no version, so that the installer can use the address
      # `releases/latest/download/<name>` and needs no call to the API.
      - name: Make the archive and its checksum
        run: |
          tar czf "spr-${{ matrix.name }}.tar.gz" -C target/release spr
          shasum -a 256 "spr-${{ matrix.name }}.tar.gz" >"spr-${{ matrix.name }}.tar.gz.sha256"

      - name: Upload the archive
        run: gh release upload "$GITHUB_REF_NAME" ./spr-*.tar.gz ./spr-*.tar.gz.sha256

  publish_release:
    name: Publish the release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Take the release out of draft
        run: gh release edit "$GITHUB_REF_NAME" --draft=false
