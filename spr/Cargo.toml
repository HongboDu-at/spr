[package]
name = "spr"
# Upstream v1.3.4 plus 17 commits (fork point d472863), plus the changes in
# this fork. The `-enhanced.N` part marks the fork, so this can never be
# confused with an upstream release, and it is what the release workflow
# matches on to avoid firing for an upstream tag.
version = "1.3.4-enhanced.1"
authors = ["Sven Over <sven@cord.com>", "Jozef Mokry <jozef@cord.com>"]
description = "Submit pull requests for individual, amendable, rebaseable commits to GitHub"
repository = "https://github.com/HongboDu-at/spr"
homepage = "https://github.com/HongboDu-at/spr"
license = "MIT"
# This fork must never go to crates.io under the name of the original tool.
publish = false
edition = "2021"
exclude = [".github", ".gitignore"]

[dependencies]
clap = { version = "^3.2.6", features = ["derive", "wrap_help"] }
console = "^0.15.0"
dialoguer = "^0.10.1"
futures = "^0.3.21"
futures-lite = "^1.12.0"
git2 = { version = "^0.17.2", default-features = false }
git2-ext = "1.0.0"
graphql_client = "^0.11.0"
indoc = "^1.0.3"
lazy-regex = "^2.2.2"
octocrab = { version = "^0.16.0", default-features = false, features = ["rustls"] }
reqwest = { version = "^0.11.11", default-features = false, features = ["json", "rustls-tls"] }
serde = "^1.0.136"
textwrap = "0.15.0"
thiserror = "^1.0.30"
tokio = { version = "^1.19.2", features = ["macros", "process", "rt-multi-thread", "time"] }
unicode-normalization = "^0.1.19"
inquire = "0.6.2"
